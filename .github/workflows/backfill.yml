name: backfill

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2020-06-01"
      end:
        description: "End date (YYYY-MM-DD), empty = now"
        required: false
        default: ""
      items:
        description: "Space separated item ids (empty = full watchlist)"
        required: false
        default: ""
      chunk_days:
        description: "Chunk size in days (7 keeps 2h resolution)"
        required: true
        default: "7"

concurrency:
  group: backfill
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backfill
        env:
          ITEMS: ${{ inputs.items }}
          END_ARG: ${{ inputs.end }}
        run: |
          ARGS="--start ${{ inputs.start }} --chunk-days ${{ inputs.chunk_days }}"
          if [ -n "$END_ARG" ]; then ARGS="$ARGS --end $END_ARG"; fi
          if [ -n "$ITEMS" ]; then ARGS="$ARGS --items $ITEMS"; fi
          python backend/src/backfill.py $ARGS
      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/datastore
          git diff --cached --quiet || git commit -m "data: backfill $(date -u +%Y-%m-%d) [skip ci]"
          git push
